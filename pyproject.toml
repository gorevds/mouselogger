[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mouselogger"
version = "0.2.0"
description = "Mouse-dynamics data collector for behavioural-biometric authentication research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dmitry Gorev" }]
keywords = ["mouse-dynamics", "behavioural-biometrics", "authentication", "research"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "mypy"]
build = ["pyinstaller"]

[project.scripts]
mouselogger = "mouselogger.cli:main"

[tool.setuptools.packages.find]
include = ["mouselogger*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
# проверяем код как для Windows, чтобы разрешались ctypes.windll / winreg
platform = "win32"
ignore_missing_imports = true
